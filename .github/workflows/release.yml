name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # Only ci.yml `rust` on main saves rust-cache.
      # - name: Rust cache
      #   uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build and publish release binaries
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./crates/vic3-analyzer"
          tagName: ${{ github.ref_name }}
          releaseName: "Vic3 Analyzer ${{ github.ref_name }}"
          releaseBody: "Desktop downloads for Victoria 3 Analyzer and Strategic Planner."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  format-release:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Format GitHub Release notes by operating system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets' | python3 -c '
          import json, sys, subprocess, os

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          assets = json.load(sys.stdin)

          def get_row(a):
              name = a["name"]
              url = a["url"]
              if name.endswith(".dmg"):
                  return (1, f"| 🍏 **macOS** | Universal (Apple Silicon & Intel) | [`.dmg`]({url}) |")
              elif name.endswith("-setup.exe") or (name.endswith(".exe") and not name.endswith(".msi")):
                  return (2, f"| 🪟 **Windows** | 64-bit Setup Installer | [`.exe`]({url}) |")
              elif name.endswith(".AppImage"):
                  return (3, f"| 🐧 **Linux** | Universal Standalone Executable | [`.AppImage`]({url}) |")
              elif name.endswith(".deb"):
                  return (4, f"| 🐧 **Linux** | Ubuntu / Debian (.deb) | [`.deb`]({url}) |")
              elif name.endswith(".rpm"):
                  return (5, f"| 🐧 **Linux** | Fedora / RHEL (.rpm) | [`.rpm`]({url}) |")
              return (99, None)

          rows = []
          for a in assets:
              rank, row = get_row(a)
              if row:
                  rows.append((rank, row))

          rows.sort(key=lambda x: x[0])

          table_lines = [
              "### 🖥️ Desktop Downloads\n",
              "| Operating System | Platform Details | Direct Download |",
              "| :--- | :--- | :--- |",
          ]
          for _, row in rows:
              table_lines.append(row)

          table_lines.append("\n---\n*Offline economic solver, what-if simulator, and strategic co-pilot for Victoria 3.*")
          notes = "\n".join(table_lines)

          subprocess.run(["gh", "release", "edit", tag, "--repo", repo, "--notes", notes], check=True)
          '

