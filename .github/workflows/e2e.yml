name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Deps
        working-directory: web
        run: npm ci
      - name: Build Web
        working-directory: web
        run: npm run build
      - name: Install E2E Deps
        working-directory: e2e
        run: npm install
      - name: Run WebdriverIO Web Tests
        run: |
          cd web
          npm run dev &
          npx wait-on http://localhost:5173/vic3-analyzer/
          cd ../e2e
          npm test
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.12.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11
      # Linux only: restore CI `rust`'s `ci-native` cache. Always save-if: false —
      # never write that key from e2e (#108). If we ever re-enable e2e saves,
      # drop shared-key (or use a Tauri-specific key) so we do not overwrite
      # `ci-native`; the old per-job tauri key was the right shape for saves,
      # but those multi-OS saves were too big for the ~10GB quota.
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          shared-key: ci-native
          save-if: "false"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install E2E Deps
        working-directory: e2e
        run: npm install
      - name: Build desktop web UI
        working-directory: web
        run: |
          npm ci
          npm run build:desktop
      - name: Build Tauri App (Debug, WebDriver)
        working-directory: crates/vic3-analyzer
        env:
          # Same pattern as scripts/docs-screenshots/desktop-tauri/prepare.mjs
          TAURI_CONFIG: '{"app":{"security":{"capabilities":["webdriver"]}}}'
        run: |
          node -e "require('fs').writeFileSync('capabilities/webdriver.json', JSON.stringify({identifier:'webdriver',description:'Companion UI + embedded WebDriver (E2E only).',windows:['main'],permissions:['core:default','allow-companion','wdio-webdriver:default','wdio:default']}, null, 2))"
          cargo build -p vic3-analyzer --features webdriver
          node -e "try { require('fs').unlinkSync('capabilities/webdriver.json') } catch (_) {}"
      - name: Run WebdriverIO Tauri Tests (Linux / xvfb)
        if: runner.os == 'Linux'
        working-directory: e2e
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # Wrap the whole WDIO process so the spawned Tauri/WebKit child inherits a
        # real X display. Auto-xvfb inside WDIO alone was not enough (app exit 101).
        run: xvfb-run -a dbus-run-session -- npm run test:tauri
      - name: Run WebdriverIO Tauri Tests
        if: runner.os != 'Linux'
        working-directory: e2e
        run: npm run test:tauri
