name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Skip all jobs on the cache bake-off branch (measure-only workflow runs instead).
jobs:
  web:
    if: github.head_ref != 'chore/cache-compress-bakeoff' && github.ref_name != 'chore/cache-compress-bakeoff'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # Re-enable when we have enough cache space — e2e web builds wasm itself
      # and benefits from this key (it does not load CI `web` job artifacts).
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     prefix-key: e2e-web-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Deps
        working-directory: web
        run: npm ci
      - name: Build Web
        working-directory: web
        run: npm run build
      - name: Install E2E Deps
        working-directory: e2e
        run: npm install
      - name: Run WebdriverIO Web Tests
        run: |
          cd web
          npm run dev &
          npx wait-on http://localhost:5173/vic3-analyzer/
          cd ../e2e
          npm test
  tauri:
    if: github.head_ref != 'chore/cache-compress-bakeoff' && github.ref_name != 'chore/cache-compress-bakeoff'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11
      # Disabled *save* (too big for ~10GB quota; see #110). If re-enabled, use a
      # Tauri-scoped key (no shared-key) — never save to `ci-native`.
      # - uses: Swatinem/rust-cache@v2
      # Linux only: restore CI `rust`'s `ci-native` cache; never write it from e2e.
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          shared-key: ci-native
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install E2E Deps
        working-directory: e2e
        run: npm install
      - name: Build desktop web UI
        working-directory: web
        run: |
          npm ci
          npm run build:desktop
      - name: Build Tauri App (Debug, WebDriver)
        working-directory: crates/vic3-analyzer
        env:
          # Same pattern as scripts/docs-screenshots/desktop-tauri/prepare.mjs
          TAURI_CONFIG: '{"app":{"security":{"capabilities":["webdriver"]}}}'
        run: |
          node -e "require('fs').writeFileSync('capabilities/webdriver.json', JSON.stringify({identifier:'webdriver',description:'Companion UI + embedded WebDriver (E2E only).',windows:['main'],permissions:['core:default','allow-companion','wdio-webdriver:default','wdio:default']}, null, 2))"
          cargo build -p vic3-analyzer --features webdriver
          node -e "try { require('fs').unlinkSync('capabilities/webdriver.json') } catch (_) {}"
      - name: Run WebdriverIO Tauri Tests (Linux / xvfb)
        if: runner.os == 'Linux'
        working-directory: e2e
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # Wrap the whole WDIO process so the spawned Tauri/WebKit child inherits a
        # real X display. Auto-xvfb inside WDIO alone was not enough (app exit 101).
        run: xvfb-run -a dbus-run-session -- npm run test:tauri
      - name: Run WebdriverIO Tauri Tests
        if: runner.os != 'Linux'
        working-directory: e2e
        run: npm run test:tauri
