name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # Re-enable when we have enough cache space — e2e web builds wasm itself
      # and benefits from this key (it does not load CI `web` job artifacts).
      # - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
      #   with:
      #     prefix-key: e2e-web-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps and build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web run build
      - name: Run WebdriverIO Web Tests
        run: |
          pnpm --filter web run dev &
          npx wait-on http://localhost:5173/vic3-analyzer/
          pnpm --filter vic3-analyzer-e2e test
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11
      # Disabled *save* (too big for ~10GB quota; see #110). If re-enabled, use a
      # Tauri-scoped key (no shared-key) — never save to `ci-native`.
      # - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
      # Linux only: restore CI `rust`'s `ci-native` cache; never write it from e2e.
      - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
        if: runner.os == 'Linux'
        with:
          prefix-key: v1-rust-zstd10-long11
          zstd-level: "10"
          zstd-long: "11"
          shared-key: ci-native
          save-if: "false"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps and build desktop web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web run build:desktop
      - name: Build Tauri App (Debug, WebDriver)
        working-directory: crates/vic3-analyzer
        env:
          # Same pattern as scripts/docs-screenshots/desktop-tauri/prepare.mjs
          TAURI_CONFIG: '{"app":{"security":{"capabilities":["webdriver"]}}}'
        run: |
          node -e "require('fs').writeFileSync('capabilities/webdriver.json', JSON.stringify({identifier:'webdriver',description:'Companion UI + embedded WebDriver (E2E only).',windows:['main'],permissions:['core:default','allow-companion','wdio-webdriver:default','wdio:default']}, null, 2))"
          cargo build -p vic3-analyzer --features webdriver
          node -e "try { require('fs').unlinkSync('capabilities/webdriver.json') } catch (_) {}"
      - name: Run WebdriverIO Tauri Tests (Linux / xvfb)
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # Wrap the whole WDIO process so the spawned Tauri/WebKit child inherits a
        # real X display. Auto-xvfb inside WDIO alone was not enough (app exit 101).
        run: xvfb-run -a dbus-run-session -- pnpm --filter vic3-analyzer-e2e run test:tauri
      - name: Run WebdriverIO Tauri Tests
        if: runner.os != 'Linux'
        run: pnpm --filter vic3-analyzer-e2e run test:tauri
