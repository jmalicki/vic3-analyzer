name: vic3-analyzer
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98
      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-deny@0.18
      - name: Rust supply chain (cargo-deny)
        run: ./scripts/deny.sh
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: JS supply chain (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE: ci
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # Only this job on pushes to main *saves* rust-cache (see #110).
      # shared-key `ci-native` is the single writer key for native Linux builds;
      # Linux e2e restores it with save-if: false. macOS/Windows e2e use separate
      # keys (`e2e-tauri-macos` / `e2e-tauri-windows`). Never write `ci-native` from e2e.
      # CARGO_PROFILE=ci (debug=1) is part of the cache key via env-vars.
      - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
        with:
          prefix-key: v0-rust-zstd10-long31
          zstd-level: "10"
          zstd-long: "31"
          shared-key: ci-native
          env-vars: CARGO_PROFILE
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/lint-rust.sh
      - run: cargo test --workspace --profile ci
      - name: MCP stdio smoke (no display)
        env:
          # Unset so an accidental Tauri window would fail on Linux runners.
          DISPLAY: ""
        run: ./scripts/mcp-smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
      #   with:
      #     prefix-key: web-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install and test web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web test
          pnpm --filter web run test:wasm
          pnpm --filter web run build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  docs-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # - uses: jmalicki/rust-cache@a8aabc19f4ebcd1e50766bb09d91c5b60aef21d3 # v2.9.2
      #   with:
      #     prefix-key: docs-screenshots-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps and build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web run build
      - name: Install Playwright Chromium
        run: pnpm --filter vic3-docs-screenshots exec playwright install --with-deps chromium
      - name: Generate screenshots
        working-directory: scripts/docs-screenshots
        timeout-minutes: 12
        env:
          DOCS_SCREENSHOTS_OUT: ${{ runner.temp }}/docs-screenshots-out
        run: pnpm run docs:screenshots
      - name: Compare to committed assets (when goldens exist)
        working-directory: scripts/docs-screenshots
        env:
          DOCS_SCREENSHOTS_OUT: ${{ runner.temp }}/docs-screenshots-out
          CI: "true"
          DOCS_SCREENSHOTS_MAX_DIFF_RATIO: "0.15"
        run: pnpm run docs:screenshots:compare
      - name: Upload screenshot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-screenshots
          path: |
            ${{ runner.temp }}/docs-screenshots-out
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
