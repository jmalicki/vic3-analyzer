name: vic3-analyzer
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: JS supply chain (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # Only this job on pushes to main *saves* rust-cache (see #110).
      # shared-key `ci-native` is the single writer key for native Linux builds;
      # Linux e2e restores it with save-if: false. If e2e ever saves again, it
      # must use a separate Tauri-scoped key — never write back to `ci-native`.
      # Other jobs' rust-cache steps are commented out or restore-only; their
      # dedicated saves were too big for the ~10GB Actions cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/lint-rust.sh
      - run: cargo test --workspace
      - name: MCP stdio smoke (no display)
        env:
          # Unset so an accidental Tauri window would fail on Linux runners.
          DISPLAY: ""
        run: ./scripts/mcp-smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     prefix-key: web-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install and test web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web test
          pnpm --filter web run test:wasm
          pnpm --filter web run build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  docs-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Disabled: rust-cache entry was too big for the ~10GB repo quota (#110).
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     prefix-key: docs-screenshots-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked --force
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps and build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web run build
      - name: Install Playwright Chromium
        run: pnpm --filter vic3-docs-screenshots exec playwright install --with-deps chromium
      - name: Generate screenshots
        working-directory: scripts/docs-screenshots
        timeout-minutes: 12
        env:
          DOCS_SCREENSHOTS_OUT: ${{ runner.temp }}/docs-screenshots-out
        run: pnpm run docs:screenshots
      - name: Compare to committed assets (when goldens exist)
        working-directory: scripts/docs-screenshots
        env:
          DOCS_SCREENSHOTS_OUT: ${{ runner.temp }}/docs-screenshots-out
          CI: "true"
          DOCS_SCREENSHOTS_MAX_DIFF_RATIO: "0.15"
        run: pnpm run docs:screenshots:compare
      - name: Upload screenshot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots
          path: |
            ${{ runner.temp }}/docs-screenshots-out
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
