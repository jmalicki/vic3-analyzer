[package]
name = "vic3-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen facade (bytes in, JSON out)"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Skip wasm-pack's auto-download of binaryen — GitHub release tarballs flake in CI
# (docs-screenshots). Local/CI builds still produce a valid module without wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
schemars.workspace = true
serde_json.workspace = true
vic3-api = { path = "../vic3-api" }
vic3-defs = { path = "../vic3-defs" }
vic3-prices = { path = "../vic3-prices" }
wasm-bindgen = "0.2"
