[package]
name = "vic3-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen facade (bytes in, JSON out)"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
schemars = "0.8"
serde.workspace = true
serde_json = "1"
