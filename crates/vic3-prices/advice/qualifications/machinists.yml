profession: machinists
levers:
  farm:
    title: "Build commercial farms"
    detail: "Peasants need laborer jobs before they qualify as machinists. Commercial farms hire laborers; subsistence farms do not."
  mine:
    title: "Build mines"
    detail: "Mines hire many laborers, who then qualify as machinists. Do not add tooling workshops yet — those consume machinists you do not have."
  workshop:
    title: "Build workshops"
    detail: "Workshops hire machinists. Only useful after laborers already exist; more workshops now add empty jobs."
  university:
    title: "Build a university"
    detail: "Literacy helps laborers qualify as machinists. Build a university only if this state already has laborers or farmers, not while it is mostly peasants."
