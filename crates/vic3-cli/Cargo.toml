[package]
name = "vic3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Victoria 3 analyzer CLI"

[lints]
workspace = true

[[bin]]
name = "vic3-cli"
path = "src/main.rs"

[features]
default = []
# Installs `tracing_samply::SamplyLayer` and enables planner/solver markers.
# Use with `--profile profiling`, e.g.:
#   cargo build --profile profiling -p vic3-cli --features profiling-markers
profiling-markers = [
    "vic3-planning/profiling-markers",
    "vic3-prices/profiling-markers",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-samply",
]

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
clap.workspace = true
dirs = "6.0.0"
rust-advanced-heaps.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tracing = { workspace = true, optional = true }
tracing-samply = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { version = "1.24.1", features = ["v4"] }
vic3-catalog = { path = "../vic3-catalog" }
vic3-defs = { path = "../vic3-defs" }
vic3-load = { path = "../vic3-load" }
vic3-mcp = { path = "../vic3-mcp" }
vic3-planning = { path = "../vic3-planning" }
vic3-prices = { path = "../vic3-prices" }
vic3save.workspace = true

[dev-dependencies]
assert_cmd = "2"
serde_json.workspace = true
tempfile = "3"
