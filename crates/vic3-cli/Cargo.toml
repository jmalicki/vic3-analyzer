[package]
name = "vic3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Victoria 3 analyzer CLI"

[lints]
workspace = true

[[bin]]
name = "vic3-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
clap.workspace = true
dirs = "6.0.0"
rust-advanced-heaps.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
uuid = { version = "1.24.1", features = ["v4"] }
vic3-defs = { path = "../vic3-defs" }
vic3-goals = { path = "../vic3-goals" }
vic3-load = { path = "../vic3-load" }
vic3-plan = { version = "0.1.0", path = "../vic3-plan" }
vic3-prices = { path = "../vic3-prices" }
vic3-sim = { version = "0.1.0", path = "../vic3-sim" }
vic3-world = { path = "../vic3-world" }
vic3save.workspace = true

[dev-dependencies]
assert_cmd = "2"
serde_json.workspace = true
