<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="25%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="inner-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Gear Gradients -->
    <linearGradient id="gold-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="gold-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chart Cyan Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-gear" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="shadow-needle" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-line" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="squircle-clip">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200" />
    </clipPath>
  </defs>

  <!-- Base Icon Squircle (macOS / standard container shape) -->
  <g filter="url(#shadow-main)">
    <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="14" />
  </g>

  <!-- Clipped inner contents -->
  <g clip-path="url(#squircle-clip)">
    <!-- Radial Ambient Backdrop -->
    <rect x="64" y="64" width="896" height="896" fill="url(#inner-glow)" />

    <!-- Subtle Technical Chart Gridlines -->
    <g opacity="0.12" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6">
      <line x1="128" y1="256" x2="896" y2="256" />
      <line x1="128" y1="384" x2="896" y2="384" />
      <line x1="128" y1="512" x2="896" y2="512" />
      <line x1="128" y1="640" x2="896" y2="640" />
      <line x1="128" y1="768" x2="896" y2="768" />
      <line x1="256" y1="128" x2="256" y2="896" />
      <line x1="384" y1="128" x2="384" y2="896" />
      <line x1="512" y1="128" x2="512" y2="896" />
      <line x1="640" y1="128" x2="640" y2="896" />
      <line x1="768" y1="128" x2="768" y2="896" />
    </g>

    <!-- Outer Decorative Dial Ring with Ticks -->
    <circle cx="512" cy="512" r="380" fill="none" stroke="url(#rim-grad)" stroke-width="4" opacity="0.4" />
    <circle cx="512" cy="512" r="360" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,16" opacity="0.5" />

    <!-- Industrial Gear (Victorian Era Cogwheel) -->
    <g filter="url(#shadow-gear)" transform="translate(512, 512)">
      <!-- 12-tooth Cogwheel -->
      <path fill="url(#gold-grad-1)" stroke="#78350f" stroke-width="4" d="
        M -65 -310 L 65 -310 L 52 -250 A 260 260 0 0 1 180 -180 L 236 -204 L 301 -91 L 243 -50 A 260 260 0 0 1 254 0 A 260 260 0 0 1 243 50 L 301 91 L 236 204 L 180 180 A 260 260 0 0 1 52 250 L 65 310 L -65 310 L -52 250 A 260 260 0 0 1 -180 180 L -236 204 L -301 91 L -243 50 A 260 260 0 0 1 -254 0 A 260 260 0 0 1 -243 -50 L -301 -91 L -236 -204 L -180 -180 A 260 260 0 0 1 -52 -250 Z
      " />
      <!-- Gear Inner Recess -->
      <circle cx="0" cy="0" r="200" fill="url(#bg-grad)" stroke="url(#gold-grad-2)" stroke-width="12" />
      <circle cx="0" cy="0" r="185" fill="#0b1120" opacity="0.8" />
      <!-- Gear Spokes -->
      <g stroke="url(#gold-grad-1)" stroke-width="18" opacity="0.7">
        <line x1="-180" y1="0" x2="180" y2="0" />
        <line x1="0" y1="-180" x2="0" y2="180" />
        <line x1="-127" y1="-127" x2="127" y2="127" />
        <line x1="-127" y1="127" x2="127" y2="-127" />
      </g>
    </g>

    <!-- Rising Economic Growth / Analytical Chart Overlay -->
    <g filter="url(#glow-line)">
      <path d="M 230 680 L 370 590 L 480 630 L 620 450 L 710 490 L 800 320" fill="none" stroke="url(#cyan-glow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Area fill under graph -->
      <path d="M 230 680 L 370 590 L 480 630 L 620 450 L 710 490 L 800 320 L 800 760 L 230 760 Z" fill="url(#cyan-glow)" opacity="0.1" />
      <!-- Data points -->
      <circle cx="230" cy="680" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
      <circle cx="370" cy="590" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
      <circle cx="480" cy="630" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
      <circle cx="620" cy="450" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
      <circle cx="710" cy="490" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
      <circle cx="800" cy="320" r="16" fill="#fef08a" stroke="#d97706" stroke-width="5" />
    </g>

    <!-- Navigational / Drafting Compass & Calipers (Analysis & Planning) -->
    <g filter="url(#shadow-needle)" transform="translate(512, 512)">
      <!-- Left Compass Arm -->
      <path d="M 0 -80 L -140 280 L -120 285 L 0 -40 Z" fill="url(#steel-grad)" stroke="#1e293b" stroke-width="3" />
      <!-- Right Compass Arm -->
      <path d="M 0 -80 L 140 280 L 120 285 L 0 -40 Z" fill="url(#steel-grad)" stroke="#1e293b" stroke-width="3" />
      <!-- Compass Measuring Arc -->
      <path d="M -110 200 A 240 240 0 0 1 110 200" fill="none" stroke="url(#gold-grad-1)" stroke-width="12" stroke-linecap="round" />
      <path d="M -90 200 A 240 240 0 0 1 90 200" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4,8" />
      
      <!-- Central Pivot / Brass Jewel Hinge -->
      <circle cx="0" cy="-60" r="42" fill="url(#gold-grad-1)" stroke="#78350f" stroke-width="5" />
      <circle cx="0" cy="-60" r="26" fill="url(#steel-grad)" />
      <circle cx="0" cy="-60" r="12" fill="#38bdf8" />

      <!-- Victoria "V" & "III" Monogram Accent -->
      <g transform="translate(0, 70)">
        <!-- Stylized Roman 'III' in Gold -->
        <path d="M -36 -12 L -36 12 M -36 0 L -36 0 M 0 -12 L 0 12 M 36 -12 L 36 12" stroke="url(#gold-grad-1)" stroke-width="8" stroke-linecap="round" />
      </g>
    </g>

    <!-- Lens Flare / Glint Highlights -->
    <g opacity="0.6">
      <ellipse cx="280" cy="220" rx="120" ry="40" fill="#ffffff" transform="rotate(-35 280 220)" opacity="0.12" />
      <!-- Star spark at top right chart peak -->
      <path d="M 800 290 L 804 315 L 830 320 L 804 325 L 800 350 L 796 325 L 770 320 L 796 315 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
