[package]
name = "vic3-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri desktop shell (GUI + mcp argv stub)"
default-run = "vic3-analyzer"

[lints]
workspace = true

[[bin]]
name = "vic3-analyzer"
path = "src/main.rs"

[lib]
name = "vic3_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
notify = "6"
notify-debouncer-mini = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { workspace = true, features = [] }
vic3-api = { path = "../vic3-api" }
vic3-catalog = { path = "../vic3-catalog" }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
vic3-defs = { path = "../vic3-defs" }
