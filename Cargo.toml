[workspace]
resolver = "2"
members = [
    "crates/vic3-load",
    "crates/vic3-defs",
    "crates/vic3-prices",
    "crates/vic3-planning",
    "crates/vic3-cli",
    "crates/vic3-api",
    "crates/vic3-catalog",
    "crates/vic3-analyzer",
    "crates/vic3-sql",
    "crates/vic3-mcp",
    "crates/vic3-wasm",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/jmalicki/vic3-analyzer"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
basin = "1.5"
bcdec_rs = "0.2"
chumsky = "0.13"
clap = { version = "4", features = ["derive", "env"] }
datafusion = "55"
derivative = "2.2"
jomini = { version = "0.35", features = ["envelope"] }
png = "0.18"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "macros"] }
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "transport-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vic3save = { git = "https://github.com/pdx-tools/pdx-tools", rev = "092edec7a853f67eea892c0d3a145329b924e103", package = "vic3save" }
rust-advanced-heaps = { git = "https://github.com/jmalicki/rust-advanced-heaps", rev = "445818b845ad8daa1146df4c1215a88fb49f8d8f" }

[workspace.lints.rust]
unexpected_cfgs = "warn"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
