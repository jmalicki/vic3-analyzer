[advisories]
version = 2
yanked = "warn"
ignore = [
    # vic3-planning: unmaintained `derivative` until migrated (mcarton/rust-derivative#117)
    "RUSTSEC-2024-0388",
    # Tauri/Linux GTK: transitive `glib` unsound advisory
    "RUSTSEC-2024-0429",
]
# Transitive unmaintained advisories (e.g. unic via Tauri) are not direct workspace deps.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
# `unlicensed = "warn"` was removed in cargo-deny 0.18+; PR-I tightens license policy.

[[licenses.clarify]]
name = "vic3save"
expression = "AGPL-3.0-or-later"
license-files = [
    { path = "../../LICENSE", hash = 0x00000000 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/pdx-tools/pdx-tools",
    "https://github.com/jmalicki/rust-advanced-heaps",
    "https://github.com/jmalicki/refbox.git",
]
